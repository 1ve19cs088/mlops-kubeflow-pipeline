name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - run: pip install -r requirements/test.txt

      # pytest.ini's addopts (-m "not docker") already excludes the
      # slow Docker/Kubeflow tests by default — nothing extra needed
      # here to keep this job fast.
      - run: pytest -v

  pipeline-and-app-checks:
    name: Pipeline run, compile, FastAPI import check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - run: pip install -r requirements/test.txt

      - name: Run training pipeline (produces model/ + artifacts/)
        run: python -m src.pipeline.run_pipeline

      - name: Compile Kubeflow pipeline
        run: python -m pipeline.compile_pipeline

      - name: Upload compiled pipeline spec
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pipeline
          path: pipeline/compiled/mlops_pipeline.yaml

      - name: Verify FastAPI app imports correctly
        # app.main builds its dynamic request schema from
        # artifacts/training_report.json at import time, so this can
        # only be checked *after* a pipeline run has produced it —
        # same prerequisite documented in README's Docker build section.
        run: python -c "from app.main import app; print('FastAPI app imported OK:', app.title)"

      - name: Upload pipeline artifacts for the Docker build job
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-artifacts
          path: |
            model/
            artifacts/

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: pipeline-and-app-checks
    steps:
      - uses: actions/checkout@v4

      - name: Download pipeline artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-run-artifacts
          path: .

      - uses: docker/setup-buildx-action@v3

      - name: Build serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.serving
          push: false
          tags: mlops-kubeflow-pipeline-serving:ci
          cache-from: type=gha,scope=serving
          cache-to: type=gha,mode=max,scope=serving

      - name: Build pipeline image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.pipeline
          push: false
          tags: mlops-kubeflow-pipeline-pipeline:ci
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,mode=max,scope=pipeline

  slow-tests:
    name: Docker + Kubeflow integration tests (manual)
    runs-on: ubuntu-latest
    needs: docker-build
    # Optional by design: only runs when someone explicitly triggers
    # it, never automatically on push/PR, since it builds real images
    # and runs real containers (slower, heavier than the fast suite).
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download pipeline artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-run-artifacts
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - run: pip install -r requirements/test.txt

      - name: Build images with matching tags (tests expect :v1)
        run: |
          docker build -f docker/Dockerfile.serving -t mlops-kubeflow-pipeline-serving:v1 .
          docker build -f docker/Dockerfile.pipeline -t mlops-kubeflow-pipeline-pipeline:v1 .

      - name: Run slow Docker + Kubeflow tests
        run: pytest -m docker -v
